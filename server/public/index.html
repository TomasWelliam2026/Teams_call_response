<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#1f8a4c">
  <title>Call Bridge</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon-192.png">
  <link rel="stylesheet" href="console.css">
</head>
<body>
  <!-- One icon set, defined once, used by <use href="#ic-…">: thin-line glyphs matching the panel's
       stroke weight, each tied to a specific action rather than decorating the page. -->
  <svg hidden aria-hidden="true">
    <symbol id="ic-mic" viewBox="0 0 20 20"><path d="M10 2a3 3 0 0 0-3 3v6a3 3 0 0 0 6 0V5a3 3 0 0 0-3-3Z"/><path d="M5 10v1a5 5 0 0 0 10 0v-1"/><path d="M10 16v2"/><path d="M7 18h6"/></symbol>
    <symbol id="ic-mic-off" viewBox="0 0 20 20"><path d="M7 5v4m0 3v1a3 3 0 0 0 4.6 2.55"/><path d="M13 9V5a3 3 0 0 0-3-3 3 3 0 0 0-2.2.95"/><path d="M5 10v1a5 5 0 0 0 7.5 4.33"/><path d="M15 10v1a5 5 0 0 1-.45 2.08"/><path d="M10 16v2"/><path d="M7 18h6"/><path d="M3 3l14 14"/></symbol>
    <symbol id="ic-headset" viewBox="0 0 20 20"><path d="M3 11a7 7 0 0 1 14 0v4"/><rect x="2" y="11" width="3" height="5" rx="1"/><rect x="15" y="11" width="3" height="5" rx="1"/><path d="M17 16v1a2 2 0 0 1-2 2h-2"/></symbol>
    <symbol id="ic-camera" viewBox="0 0 20 20"><rect x="2" y="6" width="11" height="9" rx="2"/><path d="M13 9l5-3v9l-5-3"/></symbol>
    <symbol id="ic-release" viewBox="0 0 20 20"><path d="M10 3v8"/><path d="M6 7l4-4 4 4"/><path d="M4 13v2a2 2 0 0 0 2 2h8a2 2 0 0 0 2-2v-2"/></symbol>
    <symbol id="ic-handback" viewBox="0 0 20 20"><path d="M8 4 3 9l5 5"/><path d="M3 9h9a5 5 0 0 1 5 5v2"/></symbol>
    <symbol id="ic-hangup" viewBox="0 0 20 20"><path d="M3 5c0 7 5 12 12 12l2-3-4-3-2 2a9 9 0 0 1-5-5l2-2-3-4z"/><path d="M3 3l14 14"/></symbol>
    <symbol id="ic-logout" viewBox="0 0 20 20"><path d="M8 3H5a2 2 0 0 0-2 2v10a2 2 0 0 0 2 2h3"/><path d="M12 14l4-4-4-4"/><path d="M16 10H8"/></symbol>
  </svg>
  <main>
    <header class="top">
      <h1>Call Bridge</h1>
      <button id="install" hidden>Install app</button>
    </header>
    <p class="muted">Teams calls ring here. Answer to talk with the caller through this computer's microphone and speakers.</p>
    <p id="serverAddress" class="muted"></p>
    <p id="serverHealth" class="stations" role="status"></p>
    <p id="extensionHealth" class="stations" role="status"></p>

    <form id="login">
      <label for="token">Operator token</label>
      <div class="row">
        <input type="password" id="token" autocomplete="current-password" required>
        <button type="submit" class="primary">Connect</button>
      </div>
      <label class="check"><input type="checkbox" id="remember" checked> Remember on this computer and connect automatically</label>
    </form>

    <p id="status" class="status" role="status">Not connected.</p>
    <p id="mic" class="mic" role="status"></p>

    <div id="main" hidden>
      <p id="stations" class="stations"></p>
      <label class="check" id="krispRow" hidden title="Use the Krisp desktop app's microphone: Krisp removes the noise, and you choose the headset or camera microphone in the Krisp app">
        <input type="checkbox" id="useKrisp" checked> Use Krisp microphone (Krisp removes the noise)
      </label>
      <label class="check" id="krispSpeakerRow" hidden title="Play the caller through the Krisp desktop app instead of the speakers directly, so Krisp also removes noise from what you hear. Needs Call Bridge selected for Krisp in the Krisp app itself; off by default since otherwise the caller would play into nothing.">
        <input type="checkbox" id="useKrispSpeaker"> Also play the caller through Krisp
      </label>

      <section id="ringsSection" hidden>
        <h2>Ringing</h2>
        <ul id="rings" class="calls"></ul>
      </section>

      <section id="active" hidden>
        <h2>On call</h2>
        <div class="card live">
          <strong id="activeCaller"></strong> <span id="activeClock" class="muted"></span>
          <div class="row">
            <button id="mute"><svg class="ic"><use href="#ic-mic"/></svg><span class="label">Mute</span></button>
            <button id="notHeadset" aria-pressed="false" title="Talk through the camera's microphone instead of the headset (e.g. when you take the headset off)"><svg class="ic"><use href="#ic-headset"/></svg><span class="label">Not Headset</span></button>
            <button id="release" title="Stop hearing this call; the caller stays connected"><svg class="ic"><use href="#ic-release"/></svg>Release</button>
            <button id="handBack" title="Stop the bridge; the person at the Teams computer gets the call back"><svg class="ic"><use href="#ic-handback"/></svg>Hand back to Teams computer</button>
            <button id="endCall" class="danger" title="Hang up the call on the Teams computer too, not just release the bridge"><svg class="ic"><use href="#ic-hangup"/></svg>End call</button>
          </div>
          <p id="micSource" class="muted"></p>
          <div class="row">
            <button id="camera" title="Send this computer's camera into the call instead of the Teams computer's"><svg class="ic"><use href="#ic-camera"/></svg><span class="label">Take full control (camera)</span></button>
            <span id="cameraStatus" class="muted"></span>
          </div>
          <div class="row">
            <label>Background
              <select id="bgMode" disabled title="Take full control (camera) first: this only reaches the caller through this computer's own camera.">
                <option value="none">None</option>
                <option value="blur">Blur</option>
                <option value="inTheZone1">In The Zone</option>
                <option value="inTheZone2">In The Zone 2</option>
                <option value="starfieldGravJump">Starfield – Grav Jump</option>
              </select>
            </label>
          </div>
          <video id="cameraPreview" class="preview" autoplay muted playsinline hidden></video>
        </div>
      </section>

      <section id="callsSection" hidden>
        <h2>Live calls</h2>
        <ul id="calls" class="calls"></ul>
      </section>

      <p><button id="signOut" class="link"><svg class="ic"><use href="#ic-logout"/></svg>Sign out</button></p>
    </div>
  </main>
  <script src="background-effect.js"></script>
  <script src="console.js"></script>
</body>
</html>
