<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Teams Call Answerer</title>
  <link rel="stylesheet" href="panel.css">
</head>
<body>
  <h1>Server connection</h1>

  <label for="serverUrl">Server URL</label>
  <input type="text" id="serverUrl" placeholder="wss://your-server/call" spellcheck="false" autocomplete="off">
  <label for="bridgeToken">Access token</label>
  <div class="secret">
    <input type="password" id="bridgeToken" autocomplete="off" spellcheck="false">
    <button type="button" id="showToken" aria-pressed="false">Show</button>
  </div>

  <p class="pill" id="stationStatus" data-state="off" role="status">
    <span class="dot"></span><span id="stationText">Not set up</span>
  </p>
  <p id="connDetail" class="detail">Enter the server URL and access token. It connects automatically.</p>

  <script src="bridge.js"></script>
  <script src="panel.js"></script>
</body>
</html>
