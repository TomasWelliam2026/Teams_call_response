<!doctype html>
<meta charset="utf-8">
<title>Caller copies test</title>
<!-- Checks that the caller is heard once when Teams brings the same audio in on two tracks, here
     600 ms apart. The copies are told apart by pitch (440 Hz and 660 Hz, the same speech-like
     loudness): once they're recognised as copies, only one pitch comes out of the bridge.
     node test/serve.js 8765, open http://localhost:8765/test/caller-copies.html, press Start.
     ?script=<path> runs another page-audio.js (e.g. an older one) against the same test.
     ?lag=<s> sets how far apart the copies are; ?other=1 makes the second track a different voice,
     which must be heard too. -->
<button id="start">Start</button>
<pre id="out"></pre>
<script>
// The far end of the call, made before page-audio.js patches RTCPeerConnection: it isn't part of the
// "Teams" call the extension takes over, so its outgoing audio isn't replaced by the app's.
const FarEndPC = window.RTCPeerConnection;
const script = document.createElement('script');
script.src = new URLSearchParams(location.search).get('script') || '../page-audio.js';
document.head.append(script);

const out = document.getElementById('out');
const log = (s) => { out.textContent += `${s}\n`; };
const wait = (ms) => new Promise((r) => setTimeout(r, ms));
const params = new URLSearchParams(location.search);
const LAG_S = Number(params.get('lag') || 0.6);
const OTHER = params.has('other'); // the second track is someone else, not a copy

/** Speech-like loudness: syllables and pauses of varying length, the same every run. */
function envelope(t, voice = 0) {
  if (t < 0) return 0;
  let seed = (Math.floor(t / 0.12) + voice * 7919) * 2654435761 % 4294967296;
  seed = (seed ^ (seed >>> 13)) * 1274126177 % 4294967296;
  const r = (seed >>> 0) / 4294967296;
  return r < 0.35 ? 0 : 0.05 + 0.3 * r;
}

/** The caller's audio at `hz`, starting `delay` s late, as a track (no Web Audio, no click needed). */
function callerTrack(hz, delay, voice = 0) {
  const gen = new MediaStreamTrackGenerator({ kind: 'audio' });
  const writer = gen.writable.getWriter();
  let t = 0;
  setInterval(() => {
    const n = 480;
    const data = new Float32Array(n);
    for (let i = 0; i < n; i++) {
      const s = (t + i) / 48000;
      data[i] = envelope(s - delay, voice) * Math.sin(2 * Math.PI * hz * s);
    }
    writer.write(new AudioData({ format: 'f32-planar', sampleRate: 48000, numberOfFrames: n, numberOfChannels: 1, timestamp: t * 1e6 / 48000, data }));
    t += n;
  }, 10);
  return gen;
}

/** Strength of `hz` in 16 kHz samples (Goertzel). */
function power(samples, hz) {
  const k = 2 * Math.cos(2 * Math.PI * hz / 16000);
  let a = 0, b = 0;
  for (const x of samples) { const c = x + k * a - b; b = a; a = c; }
  return (a * a + b * b - k * a * b) / samples.length;
}

document.getElementById('start').onclick = async () => {
  const ch = new MessageChannel();
  window.postMessage({ __tca: 'connect' }, '*', [ch.port2]);
  const frames = [];
  const notes = [];
  ch.port1.onmessage = ({ data }) => {
    if (data.type === 'audio') frames.push(new Int16Array(data.pcm));
    else if (data.type === 'note') notes.push(data.message);
  };

  // One "call" connection bringing in two tracks: the caller, and the same caller 600 ms later.
  const a = new FarEndPC();
  const b = new RTCPeerConnection();
  a.onicecandidate = (e) => e.candidate && b.addIceCandidate(e.candidate);
  b.onicecandidate = (e) => e.candidate && a.addIceCandidate(e.candidate);
  a.addTransceiver(callerTrack(440, 0), { direction: 'sendonly' });
  a.addTransceiver(callerTrack(660, LAG_S, OTHER ? 1 : 0), { direction: 'sendonly' });
  await a.setLocalDescription(await a.createOffer());
  await b.setRemoteDescription(a.localDescription);
  await b.setLocalDescription(await b.createAnswer());
  await a.setRemoteDescription(b.localDescription);
  for (let i = 0; i < 50 && b.connectionState !== 'connected'; i++) await wait(100);
  log(`call connected: ${b.connectionState}, tracks in: ${b.getReceivers().length}`);
  window.__call = { a, b, frames };

  ch.port1.postMessage({ type: 'arm', callId: 't1' });
  await wait(12000);
  ch.port1.postMessage({ type: 'stop', callId: 't1', reason: 'test over' });
  await wait(300);

  // The last 4 s: one pitch means the caller is heard once.
  const tail = frames.slice(-200).flatMap(f => [...f].map(v => v / 32768));
  const p440 = power(tail, 440);
  const p660 = power(tail, 660);
  const ratio = Math.max(p440, p660) / Math.max(1e-12, Math.min(p440, p660));
  const rms = Math.sqrt(tail.reduce((s, v) => s + v * v, 0) / Math.max(1, tail.length));
  const result = { frames: frames.length, rms: +rms.toFixed(4), heardTwice: ratio < 10, ratio: Math.round(ratio), notes };
  result.pass = frames.length > 400 && (OTHER
    ? result.heardTwice && !notes.some(n => n.includes('playing it once'))
    : !result.heardTwice && notes.some(n => n.includes('playing it once')));
  log(JSON.stringify(result, null, 1));
  document.title = result.pass ? 'PASS' : 'FAIL';
};
</script>
