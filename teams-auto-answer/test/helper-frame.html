<!doctype html>
<meta charset="utf-8">
<title>Helper frame test</title>
<!-- Checks that the call's audio keeps reaching the bridge when Teams moves it, mid-call, to a connection
     made with a blank helper frame's RTCPeerConnection (which no content script runs in), and stops
     bringing it in on the first connection. node test/serve.js 8765, open
     http://localhost:8765/test/helper-frame.html, press Start. -->
<script>window.__NativePC = window.RTCPeerConnection; // the caller's side, unseen by the extension</script>
<script src="../page-audio.js"></script>
<button id="start">Start</button>
<pre id="out"></pre>
<script>
const out = document.getElementById('out');
const log = (s) => { out.textContent += `${s}\n`; };
const wait = (ms) => new Promise((r) => setTimeout(r, ms));

/** A 440 Hz tone as a track, made without Web Audio (no click needed). */
function toneTrack() {
  const gen = new MediaStreamTrackGenerator({ kind: 'audio' });
  const writer = gen.writable.getWriter();
  let t = 0;
  setInterval(() => {
    const n = 480;
    const data = new Float32Array(n);
    for (let i = 0; i < n; i++) data[i] = 0.3 * Math.sin(2 * Math.PI * 440 * (t + i) / 48000);
    writer.write(new AudioData({ format: 'f32-planar', sampleRate: 48000, numberOfFrames: n, numberOfChannels: 1, timestamp: t * 1e6 / 48000, data }));
    t += n;
  }, 10);
  return gen;
}

async function negotiate(a, b) {
  await a.setLocalDescription(await a.createOffer());
  await b.setRemoteDescription(a.localDescription);
  await b.setLocalDescription(await b.createAnswer());
  await a.setRemoteDescription(b.localDescription);
}

/** caller (unseen) -> `PC` (Teams' side), audio one way. */
async function call(PC) {
  const caller = new window.__NativePC();
  const teams = new PC();
  caller.onicecandidate = (e) => e.candidate && teams.addIceCandidate(e.candidate);
  teams.onicecandidate = (e) => e.candidate && caller.addIceCandidate(e.candidate);
  const sending = caller.addTransceiver(toneTrack(), { direction: 'sendonly' });
  await negotiate(caller, teams);
  for (let i = 0; i < 50 && teams.connectionState !== 'connected'; i++) await wait(100);
  return { caller, teams, sending };
}

document.getElementById('start').onclick = async () => {
  const ch = new MessageChannel();
  window.postMessage({ __tca: 'connect' }, '*', [ch.port2]);
  let frames = 0;
  const notes = [];
  ch.port1.onmessage = ({ data }) => {
    if (data.type === 'audio') frames++;
    else notes.push(data.type === 'note' ? data.message : data.type);
  };
  const perTwoSeconds = [];
  const measure = async (times) => {
    for (let i = 0; i < times; i++) {
      const before = frames;
      await wait(2000);
      perTwoSeconds.push(frames - before); // 100 expected (20 ms frames)
    }
  };

  const first = await call(RTCPeerConnection);
  log(`first connection: ${first.teams.connectionState}`);
  ch.port1.postMessage({ type: 'arm', callId: 't1' });
  await wait(1500);
  await measure(2);

  // Teams moves the call: a new connection made in a blank frame, then the first stops receiving.
  const frame = document.createElement('iframe');
  document.body.appendChild(frame);
  const second = await call(frame.contentWindow.RTCPeerConnection);
  log(`second connection (helper frame): ${second.teams.connectionState}`);
  first.sending.direction = 'inactive';
  await negotiate(first.caller, first.teams);
  log(`first connection now ${first.teams.getTransceivers()[0].currentDirection}`);
  await measure(5);

  ch.port1.postMessage({ type: 'stop', callId: 't1', reason: 'test over' });
  await wait(300);
  const result = {
    perTwoSeconds,
    sawHelperFrame: notes.some(n => /helper frame \(about:blank\)/.test(n)),
    sawStopReceiving: notes.some(n => /stopped bringing the caller's audio in/.test(n)),
    notes,
  };
  const [, , moving, ...after] = perTwoSeconds;
  result.pass = notes.includes('started') && perTwoSeconds.slice(0, 2).every(n => n > 90)
    && moving > 50 && after.every(n => n > 90) && result.sawHelperFrame && result.sawStopReceiving;
  log(JSON.stringify(result, null, 1));
  document.title = result.pass ? 'PASS' : 'FAIL';
};
</script>
