<!doctype html>
<meta charset="utf-8">
<title>Speaker silence test</title>
<!-- Checks that while a call is bridged, Teams' player of the caller is silenced (volume 0) and the
     call's audio still reaches the bridge the whole time; and that the volume comes back after.
     node test/serve.js 8765, open http://localhost:8765/test/speaker-silence.html, press Start. -->
<script src="../page-audio.js"></script>
<button id="start">Start</button>
<pre id="out"></pre>
<script>
const out = document.getElementById('out');
const log = (s) => { out.textContent += `${s}\n`; };
const wait = (ms) => new Promise((r) => setTimeout(r, ms));

/** A 440 Hz tone as a track, made without Web Audio (no click needed). */
function toneTrack() {
  const gen = new MediaStreamTrackGenerator({ kind: 'audio' });
  const writer = gen.writable.getWriter();
  let t = 0;
  setInterval(() => {
    const n = 480;
    const data = new Float32Array(n);
    for (let i = 0; i < n; i++) data[i] = 0.3 * Math.sin(2 * Math.PI * 440 * (t + i) / 48000);
    writer.write(new AudioData({ format: 'f32-planar', sampleRate: 48000, numberOfFrames: n, numberOfChannels: 1, timestamp: t * 1e6 / 48000, data }));
    t += n;
  }, 10);
  return gen;
}

document.getElementById('start').onclick = async () => {
  const ch = new MessageChannel();
  window.postMessage({ __tca: 'connect' }, '*', [ch.port2]);
  let frames = 0;
  const notes = [];
  ch.port1.onmessage = ({ data }) => { if (data.type === 'audio') frames++; else notes.push(data.type); };

  // A loopback "call": the caller (a) sends a tone, Teams (b) plays it in an <audio>, like Teams does.
  const a = new RTCPeerConnection();
  const b = new RTCPeerConnection();
  a.onicecandidate = (e) => e.candidate && b.addIceCandidate(e.candidate);
  b.onicecandidate = (e) => e.candidate && a.addIceCandidate(e.candidate);
  const teamsPlayer = new Audio();
  b.ontrack = (e) => { teamsPlayer.srcObject = new MediaStream([e.track]); teamsPlayer.play().catch((err) => log(`play: ${err.message}`)); };
  a.addTrack(toneTrack());
  b.addTransceiver('audio', { direction: 'sendrecv' });
  await a.setLocalDescription(await a.createOffer());
  await b.setRemoteDescription(a.localDescription);
  await b.setLocalDescription(await b.createAnswer());
  await a.setRemoteDescription(b.localDescription);
  for (let i = 0; i < 50 && b.connectionState !== 'connected'; i++) await wait(100);
  log(`call connected: ${b.connectionState}, player volume ${teamsPlayer.volume}`);

  ch.port1.postMessage({ type: 'arm', callId: 't1' });
  await wait(1500);
  const volumeWhileBridged = teamsPlayer.volume;
  const startFrames = frames;
  await wait(12000);
  const perSecond = (frames - startFrames) / 12;
  ch.port1.postMessage({ type: 'stop', callId: 't1', reason: 'test over' });
  await wait(300);
  const result = {
    started: notes.includes('started'),
    volumeWhileBridged,
    framesPerSecond: Math.round(perSecond), // 50 expected (20 ms frames)
    volumeAfter: teamsPlayer.volume,
    stopped: notes.includes('stopped'),
  };
  result.pass = result.started && volumeWhileBridged === 0 && perSecond > 45 && result.volumeAfter === 1 && result.stopped;
  log(JSON.stringify(result, null, 1));
  document.title = result.pass ? 'PASS' : 'FAIL';
};
</script>
