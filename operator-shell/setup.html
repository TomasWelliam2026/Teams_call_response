<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Safe Job setup</title>
<style>
  :root {
    --ink: #eceeef;
    --muted: #868d95;
    --line: #2c3036;
    --field: #121417;
    --panel: #15171a;
    --amber: #e8a33d;
    --green: #3fae6a;
    --red: #d8574b;
    --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    --sans: -apple-system, "Segoe UI", system-ui, sans-serif;
    color-scheme: light dark;
  }
  @media (prefers-color-scheme: light) {
    :root {
      --ink: #15171a;
      --muted: #5b6269;
      --line: #d7dbe0;
      --field: #f4f5f7;
      --panel: #ffffff;
      --green: #1f8a4c;
      --red: #c0392b;
    }
  }

  * { box-sizing: border-box; }
  body {
    margin: 0;
    padding: 20px 20px 18px;
    font: 13px/1.5 var(--sans);
    background: var(--panel);
    color: var(--ink);
  }

  .readout {
    display: flex;
    align-items: baseline;
    gap: 9px;
    margin: 2px 0 2px;
  }
  .lamp {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: var(--muted);
    flex: none;
    transform: translateY(-1px);
    transition: background .2s ease, box-shadow .2s ease;
  }
  .readout[data-state="connecting"] .lamp { background: var(--amber); box-shadow: 0 0 7px 1px color-mix(in srgb, var(--amber) 70%, transparent); }
  .readout[data-state="connected"]  .lamp { background: var(--green); box-shadow: 0 0 7px 1px color-mix(in srgb, var(--green) 70%, transparent); }
  .readout[data-state="error"], .readout[data-state="invalid"] { }
  .readout[data-state="error"] .lamp, .readout[data-state="invalid"] .lamp { background: var(--red); box-shadow: 0 0 7px 1px color-mix(in srgb, var(--red) 70%, transparent); }

  #host {
    font: 13px/1.3 var(--mono);
    letter-spacing: .01em;
    color: var(--ink);
  }
  #host:empty::before { content: "not connected"; color: var(--muted); font-family: var(--sans); font-style: normal; }
  #detail { margin: 0 0 18px 17px; color: var(--muted); font-size: 12px; min-height: 15px; }
  #detail[data-state="error"], #detail[data-state="invalid"] { color: var(--red); }

  .rule { border: none; border-top: 1px solid var(--line); margin: 16px 0; }

  .field { margin-bottom: 14px; }
  .field label {
    display: block;
    font-size: 11.5px;
    color: var(--muted);
    margin-bottom: 6px;
  }
  input[type="text"], input[type="password"] {
    font: 13px/1.3 var(--mono);
    width: 100%;
    padding: 8px 10px;
    border-radius: 3px;
    border: 1px solid var(--line);
    background: var(--field);
    color: var(--ink);
  }
  input:focus { outline: none; border-color: var(--green); }

  .secret { display: flex; gap: 6px; }
  .secret input { flex: 1; min-width: 0; }
  .secret button {
    font: 12px var(--sans);
    flex: none;
    padding: 0 12px;
    border-radius: 3px;
    border: 1px solid var(--line);
    background: transparent;
    color: var(--muted);
    cursor: pointer;
  }
  .secret button:hover { color: var(--ink); border-color: var(--muted); }

  #error { color: var(--red); min-height: 15px; margin-top: 7px; font-size: 12px; }

  .switch-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    margin-top: 4px;
  }
  .switch-row label { color: var(--ink); font-size: 12.5px; }
  .switch {
    position: relative;
    width: 34px;
    height: 19px;
    flex: none;
    border-radius: 10px;
    background: var(--line);
    border: none;
    cursor: pointer;
    padding: 0;
    transition: background .15s ease;
  }
  .switch::after {
    content: "";
    position: absolute;
    top: 2px; left: 2px;
    width: 15px; height: 15px;
    border-radius: 50%;
    background: var(--panel);
    transition: transform .15s ease;
  }
  .switch[aria-pressed="true"] { background: var(--green); }
  .switch[aria-pressed="true"]::after { transform: translateX(15px); }
</style>
</head>
<body>
  <button type="button" id="collapse" title="Collapse to tray icon" style="position:fixed; top:10px; right:10px; width:26px; height:26px; border-radius:50%; border:1px solid var(--line); background:transparent; color:var(--muted); cursor:pointer; font-size:13px;">&#8595;</button>

  <div class="readout" id="status" data-state="off">
    <span class="lamp"></span><span id="host"></span>
  </div>
  <p id="detail">Enter the server address and operator token. It connects automatically.</p>

  <hr class="rule">

  <div class="field">
    <label for="url">Server address</label>
    <input type="text" id="url" placeholder="https://your-server-address/" autofocus autocomplete="off" spellcheck="false">
  </div>

  <div class="field">
    <label for="token">Operator token</label>
    <div class="secret">
      <input type="password" id="token" autocomplete="off" spellcheck="false">
      <button type="button" id="showToken" aria-pressed="false">Show</button>
    </div>
  </div>
  <div id="error"></div>

  <hr class="rule">

  <div class="switch-row">
    <label for="openAtLogin">Start Safe Job when Windows starts</label>
    <button type="button" class="switch" id="openAtLogin" role="switch" aria-pressed="false"></button>
  </div>

  <script>
    const $ = (id) => document.getElementById(id);

    let debounceTimer = null;
    let lastAttempted = '';

    function looksLikeUrl(value) {
      try {
        const parsed = new URL(value);
        return parsed.protocol === 'http:' || parsed.protocol === 'https:';
      } catch {
        return false;
      }
    }

    function render(state, host, detailText) {
      $('status').dataset.state = state;
      $('host').textContent = host || '';
      $('detail').textContent = detailText;
      $('detail').dataset.state = state;
    }

    async function attemptConnect(url, token) {
      const key = `${url}\u0000${token}`;
      if (key === lastAttempted) return;
      lastAttempted = key;
      $('error').textContent = '';
      const host = new URL(url).host;
      render('connecting', host, 'Connecting…');
      try {
        await window.callBridgeSetup.save({ serverUrl: url, token });
        render('connected', host, 'Connected.');
      } catch (err) {
        render('error', host, 'Could not connect. Check the address and token.');
        $('error').textContent = err?.message || 'Could not save that address.';
      }
    }

    function scheduleConnect() {
      clearTimeout(debounceTimer);
      const url = $('url').value.trim();
      const token = $('token').value.trim();
      if (!url && !token) { render('off', '', 'Enter the server address and operator token. It connects automatically.'); return; }
      if (!looksLikeUrl(url)) { render('invalid', '', 'That does not look like a valid server address.'); return; }
      if (!token) { render('off', new URL(url).host, 'Enter the operator token to finish connecting.'); return; }
      render('connecting', new URL(url).host, 'Looks valid — connecting shortly…');
      debounceTimer = setTimeout(() => attemptConnect(url, token), 600);
    }

    $('url').addEventListener('input', scheduleConnect);
    $('token').addEventListener('input', scheduleConnect);
    for (const id of ['url', 'token']) {
      $(id).addEventListener('keydown', (e) => {
        if (e.key !== 'Enter') return;
        clearTimeout(debounceTimer);
        const url = $('url').value.trim();
        const token = $('token').value.trim();
        if (looksLikeUrl(url) && token) attemptConnect(url, token);
      });
    }

    $('showToken').addEventListener('click', () => {
      const show = $('token').type === 'password';
      $('token').type = show ? 'text' : 'password';
      $('showToken').textContent = show ? 'Hide' : 'Show';
      $('showToken').setAttribute('aria-pressed', show);
    });

    $('openAtLogin').addEventListener('click', () => {
      const next = $('openAtLogin').getAttribute('aria-pressed') !== 'true';
      $('openAtLogin').setAttribute('aria-pressed', String(next));
      window.callBridgeSetup.setOpenAtLogin(next);
    });

    $('collapse').addEventListener('click', () => window.callBridgeSetup.collapse());

    (async () => {
      try {
        const config = await window.callBridgeSetup.getConfig();
        if (config.serverUrl) $('url').value = config.serverUrl;
        if (config.token) $('token').value = config.token;
        $('openAtLogin').setAttribute('aria-pressed', String(!!config.openAtLogin));
        if (config.serverUrl && config.token) {
          lastAttempted = `${config.serverUrl}\u0000${config.token}`;
          render('connected', new URL(config.serverUrl).host, 'Connected.');
        }
      } catch { /* defaults are fine */ }
    })();
  </script>
</body>
</html>
